{{ define "main" }}
<header class="list-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="about-p">{{ . }}</div>{{ end }}
</header>

<ul class="page-list">
  {{ range .Pages }}
    <li>
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>
{{ end }}
