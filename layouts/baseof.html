<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ T "skipToContent" }}</a>

  {{ partial "header.html" . }}

  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ with resources.Get "js/main.js" }}
    {{ $js := . | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
    <script type="module" src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous"></script>
  {{ end }}
</body>
</html>
