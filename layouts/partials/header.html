<header>
    <div class="nav-container">
        <div class="logo">
            <a href="{{ .Site.BaseURL }}" aria-label="Genial Inc.">
                <img src="{{ .Site.Params.smallLogo | default "/images/genial_logo_petit.png" }}" alt="Genial Inc. logo" class="brand-logo">
            </a>
        </div>
        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <nav>
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}"{{ if eq .URL "/" }} class="active"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>
    </div>
</header>
