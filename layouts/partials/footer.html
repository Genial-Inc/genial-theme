<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <a href="{{ site.Home.RelPermalink }}" aria-label="{{ T "logo_alt" }}">
                <img src="{{ site.Params.smallLogo | relURL }}" alt="" width="56" height="56">
            </a>
            <p>{{ T "footer_tagline" }}</p>
        </div>

        <div class="footer-column">
            <h2>{{ T "footer_about" }}</h2>
            <a href="{{ "about-us/" | relLangURL }}">{{ T "footer_about" }}</a>
            <a href="{{ site.Params.studyProgram }}" target="_blank" rel="noopener noreferrer">{{ T "study_program" }}</a>
        </div>

        <div class="footer-column">
            <h2>{{ T "footer_resources" }}</h2>
            <a href="{{ "projects/" | relLangURL }}">{{ T "all_projects" }}</a>
            <a href="{{ "contact/" | relLangURL }}">{{ T "contact_demo" }}</a>
            <a href="{{ site.Params.github }}" target="_blank" rel="noopener noreferrer">{{ T "github" }}</a>
        </div>
    </div>
    <p class="footer-note">© {{ now.Year }} Genial Inc.</p>
</footer>
